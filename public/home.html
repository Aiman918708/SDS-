<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Market Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!--Links For All Webpages-->
  <nav class="top-nav">
    <a href="home.html">Home</a>
    <a href="markets.html">Markets</a>
    <a href="news.html">News</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="services.html">Services</a>
  </nav>

  <!-- Ticker Tape-->
  <div class="ticker-wrap">
    <div class="ticker" id="tickerTape">
      Loading market data... <!--Displayed while Data is being pulled-->
    </div>
  </div>

  <div class="search-container"> <!--Ticker Search-->
    <form class="search-box" id="stockForm">
      <svg class="search-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>

      <input
        type="text"
        id="tickerInput"
        placeholder="Search ticker..."
      >
    </form>
  </div>

  <div class="stock-card" id="stockCard">
    <h2 id="symbol">---</h2>
    <p id="price">
      Price: --
    </p>
    <p id="change">
      Change: --
    </p>
  </div>

  <div class="chart-container">
    <h2>Chart</h2>
    <div class="chart-placeholder">
      Chart will go here
    </div>
  </div>

  <div class="ai-summary-card">
    <h2>🤖 AI Market Summary</h2>
    <p id="aiSummary">
        Search a stock to generate an AI summary.
    </p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="main.js"></script>
<script src="sketch.js"></script>

</body>
</html>
